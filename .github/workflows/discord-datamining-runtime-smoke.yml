name: Discord Datamining Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Discord Web channel to collect"
        required: false
        default: "canary"
        type: choice
        options:
          - canary
          - ptb
          - stable
      feature_id:
        description: "Built-in feature scenario to run"
        required: true
        default: "bootstrap.idle.session"
      max_assets:
        description: "Maximum static assets/chunks to download before runtime"
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'canary' }}
      FEATURE_ID: ${{ github.event.inputs.feature_id || 'bootstrap.idle.session' }}
      MAX_ASSETS: ${{ github.event.inputs.max_assets || '150' }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build datamining package
        run: npm run build --workspace @spacebar/automatic-reverse-engineering

      - name: Prepare run id
        run: |
          RUN_ID="$(date -u +'%Y-%m-%dT%H-%M-%SZ')-${CHANNEL}-${FEATURE_ID//./-}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "RUN_DIR=packages/automatic-reverse-engineering/data/runs/${RUN_ID}" >> "$GITHUB_ENV"
          echo "COVERAGE_DIR=packages/automatic-reverse-engineering/data/coverage/${RUN_ID}" >> "$GITHUB_ENV"

      - name: Prepare runtime secrets
        env:
          DISCORD_DATAMINING_STORAGE_STATE_B64: ${{ secrets.DISCORD_DATAMINING_STORAGE_STATE_B64 }}
          DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT: ${{ secrets.DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT }}
          DISCORD_DATAMINING_FIXTURES_JSON: ${{ secrets.DISCORD_DATAMINING_FIXTURES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_DATAMINING_STORAGE_STATE_B64:-}" ]; then
            echo "::error::Missing DISCORD_DATAMINING_STORAGE_STATE_B64 secret"
            exit 1
          fi
          if [ -z "${DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT:-}" ]; then
            echo "::error::Missing DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT secret"
            exit 1
          fi
          if [ -z "${DISCORD_DATAMINING_FIXTURES_JSON:-}" ]; then
            echo "::error::Missing DISCORD_DATAMINING_FIXTURES_JSON secret"
            exit 1
          fi
          umask 077
          STORAGE_STATE="$RUNNER_TEMP/discord-storage-state.json"
          FIXTURES="$RUNNER_TEMP/fixtures.local.json"
          printf '%s' "$DISCORD_DATAMINING_STORAGE_STATE_B64" | base64 --decode > "$STORAGE_STATE"
          printf '%s' "$DISCORD_DATAMINING_FIXTURES_JSON" > "$FIXTURES"
          STORAGE_STATE="$STORAGE_STATE" FIXTURES="$FIXTURES" STORAGE_STATE_CREATED_AT="$DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT" node -e 'const fs = require("node:fs"); JSON.parse(fs.readFileSync(process.env.STORAGE_STATE, "utf8")); JSON.parse(fs.readFileSync(process.env.FIXTURES, "utf8")); if (!Number.isFinite(Date.parse(process.env.STORAGE_STATE_CREATED_AT))) throw new Error("DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT must be ISO-8601");'
          echo "STORAGE_STATE=$STORAGE_STATE" >> "$GITHUB_ENV"
          echo "STORAGE_STATE_CREATED_AT=$DISCORD_DATAMINING_STORAGE_STATE_CREATED_AT" >> "$GITHUB_ENV"
          echo "FIXTURES=$FIXTURES" >> "$GITHUB_ENV"

      - name: Resolve source refs
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js resolve-source-refs \
            --out packages/automatic-reverse-engineering/data/catalogs/source-refs.json

      - name: Fetch third-party static inputs
        run: |
          set -euo pipefail
          XHYROM_SHA="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const refs = JSON.parse(readFileSync('packages/automatic-reverse-engineering/data/catalogs/source-refs.json', 'utf8')); console.log(refs.xhyrom_routes_commit)")"
          USERDOCCERS_SHA="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const refs = JSON.parse(readFileSync('packages/automatic-reverse-engineering/data/catalogs/source-refs.json', 'utf8')); console.log(refs.userdoccers_commit)")"
          clone_sparse_ref() {
            local repo="$1"
            local sha="$2"
            local target="$3"
            shift 3
            git init "$target"
            git -C "$target" remote add origin "https://github.com/${repo}.git"
            git -C "$target" sparse-checkout init --cone
            git -C "$target" sparse-checkout set "$@"
            git -C "$target" fetch --depth 1 origin "$sha"
            git -C "$target" checkout --detach FETCH_HEAD
          }
          rm -rf /tmp/discord-third-party
          mkdir -p /tmp/discord-third-party
          clone_sparse_ref xHyroM/discord-datamining "$XHYROM_SHA" /tmp/discord-third-party/xhyrom data/client
          clone_sparse_ref discord-userdoccers/discord-userdoccers "$USERDOCCERS_SHA" /tmp/discord-third-party/userdoccers pages

      - name: Collect Discord static snapshot
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js collect-static \
            --run-id "$RUN_ID" \
            --channel "$CHANNEL" \
            --out "$RUN_DIR" \
            --download-assets \
            --max-assets "$MAX_ASSETS" \
            --source-refs-file packages/automatic-reverse-engineering/data/catalogs/source-refs.json

      - name: Build local catalogs
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js import-openapi \
            --input assets/openapi.json \
            --out packages/automatic-reverse-engineering/data/catalogs/routes.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js import-source-routes \
            --root src/api/routes \
            --out packages/automatic-reverse-engineering/data/catalogs/routes.source.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js import-gateway-source \
            --constants src/gateway/util/Constants.ts \
            --handlers src/gateway/opcodes/index.ts \
            --events src/util/interfaces/Event.ts \
            --schemas src/schemas/gateway/index.ts \
            --out packages/automatic-reverse-engineering/data/catalogs/gateway.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js build-docs-index \
            --routes packages/automatic-reverse-engineering/data/catalogs/routes.source.catalog.json \
            --gateway packages/automatic-reverse-engineering/data/catalogs/gateway.catalog.json \
            --out packages/automatic-reverse-engineering/data/catalogs/docs.index.json
          node packages/automatic-reverse-engineering/dist/cli.js import-xhyrom-routes \
            --input /tmp/discord-third-party/xhyrom/data/client/routes.json \
            --out packages/automatic-reverse-engineering/data/catalogs/routes.xhyrom.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js import-xhyrom-experiments \
            --input /tmp/discord-third-party/xhyrom/data/client/experiments/experiments.json \
            --out packages/automatic-reverse-engineering/data/catalogs/experiments.xhyrom.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js import-userdoccers-routes \
            --root /tmp/discord-third-party/userdoccers/pages \
            --out packages/automatic-reverse-engineering/data/catalogs/routes.userdoccers.catalog.json
          node packages/automatic-reverse-engineering/dist/cli.js import-userdoccers-gateway \
            --events /tmp/discord-third-party/userdoccers/pages/gateway/gateway-events.mdx \
            --opcodes /tmp/discord-third-party/userdoccers/pages/gateway/opcodes-and-close-codes.mdx \
            --out packages/automatic-reverse-engineering/data/catalogs/gateway.userdoccers.catalog.json

      - name: Extract experiments and bundle static context
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js extract-experiments \
            --assets "$RUN_DIR/static/assets.json" \
            --static-dir "$RUN_DIR/static" \
            --out "$RUN_DIR/static/experiments.catalog.json"
          node packages/automatic-reverse-engineering/dist/cli.js bundle-static-context \
            --run-dir "$RUN_DIR" \
            --routes packages/automatic-reverse-engineering/data/catalogs/routes.catalog.json \
            --source-routes packages/automatic-reverse-engineering/data/catalogs/routes.source.catalog.json \
            --gateway packages/automatic-reverse-engineering/data/catalogs/gateway.catalog.json \
            --experiments "$RUN_DIR/static/experiments.catalog.json" \
            --docs packages/automatic-reverse-engineering/data/catalogs/docs.index.json \
            --xhyrom-routes packages/automatic-reverse-engineering/data/catalogs/routes.xhyrom.catalog.json \
            --xhyrom-experiments packages/automatic-reverse-engineering/data/catalogs/experiments.xhyrom.catalog.json \
            --userdoccers-routes packages/automatic-reverse-engineering/data/catalogs/routes.userdoccers.catalog.json \
            --userdoccers-gateway packages/automatic-reverse-engineering/data/catalogs/gateway.userdoccers.catalog.json \
            --source-refs-file packages/automatic-reverse-engineering/data/catalogs/source-refs.json

      - name: Preflight runtime inputs
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js preflight-runtime \
            --storage-state "$STORAGE_STATE" \
            --fixtures "$FIXTURES" \
            --feature-id "$FEATURE_ID" \
            --storage-state-created-at "$STORAGE_STATE_CREATED_AT" \
            --max-storage-state-age-ms 604800000 \
            --out "$RUN_DIR/features/$FEATURE_ID/preflight.json"

      - name: Preflight full-suite readiness
        continue-on-error: true
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js preflight-runtime \
            --storage-state "$STORAGE_STATE" \
            --fixtures "$FIXTURES" \
            --all-built-ins true \
            --storage-state-created-at "$STORAGE_STATE_CREATED_AT" \
            --max-storage-state-age-ms 604800000 \
            --out "$RUN_DIR/runtime-readiness.json"

      - name: Run browser feature smoke
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js run-playwright-feature \
            --run-id "$RUN_ID" \
            --out "$RUN_DIR" \
            --feature-id "$FEATURE_ID" \
            --storage-state "$STORAGE_STATE" \
            --fixtures "$FIXTURES" \
            --routes "$RUN_DIR/static/routes.xhyrom.catalog.json" \
            --build "$RUN_DIR/static/build.json" \
            --docs "$RUN_DIR/static/docs.index.json" \
            --channel "$CHANNEL" \
            --storage-state-created-at "$STORAGE_STATE_CREATED_AT" \
            --max-storage-state-age-ms 604800000 \
            --save-video-on-failure false

      - name: Build coverage and review queue
        run: |
          SUMMARY="$RUN_DIR/features/$FEATURE_ID/summary.json"
          node packages/automatic-reverse-engineering/dist/cli.js coverage \
            --summaries "$SUMMARY" \
            --builds "$RUN_DIR/static/build.json" \
            --routes "$RUN_DIR/static/routes.source.catalog.json" \
            --gateway "$RUN_DIR/static/gateway.catalog.json" \
            --out "$COVERAGE_DIR"
          node packages/automatic-reverse-engineering/dist/cli.js review-queue \
            --summaries "$SUMMARY" \
            --routes "$RUN_DIR/static/routes.source.catalog.json" \
            --gateway "$RUN_DIR/static/gateway.catalog.json" \
            --out "$RUN_DIR/review-queue.json"

      - name: Validate redaction and completion
        run: |
          node packages/automatic-reverse-engineering/dist/cli.js validate-redaction \
            --input "$RUN_DIR,$COVERAGE_DIR" \
            --out "$RUN_DIR/redaction-audit.json"
          node packages/automatic-reverse-engineering/dist/cli.js audit-run \
            --run-dir "$RUN_DIR" \
            --features "$FEATURE_ID" \
            --redaction-audit "$RUN_DIR/redaction-audit.json" \
            --coverage-dir "$COVERAGE_DIR" \
            --review-queue "$RUN_DIR/review-queue.json" \
            --out "$RUN_DIR/completion-audit.json"

      - name: Stage redacted upload
        run: |
          set -euo pipefail
          UPLOAD_DIR="$RUNNER_TEMP/discord-datamining-runtime-upload"
          FEATURE_DIR="$RUN_DIR/features/$FEATURE_ID"
          STAGED_FEATURE_DIR="$UPLOAD_DIR/features/$FEATURE_ID"
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$STAGED_FEATURE_DIR" "$UPLOAD_DIR/static"
          for file in build.json assets.json context.manifest.json routes.catalog.json routes.source.catalog.json gateway.catalog.json experiments.catalog.json docs.index.json routes.xhyrom.catalog.json experiments.xhyrom.catalog.json routes.userdoccers.catalog.json gateway.userdoccers.catalog.json; do
            cp "$RUN_DIR/static/$file" "$UPLOAD_DIR/static/$file"
          done
          cp "$RUN_DIR/redaction-audit.json" "$UPLOAD_DIR/redaction-audit.json"
          cp "$RUN_DIR/completion-audit.json" "$UPLOAD_DIR/completion-audit.json"
          if [ -f "$RUN_DIR/runtime-readiness.json" ]; then
            cp "$RUN_DIR/runtime-readiness.json" "$UPLOAD_DIR/runtime-readiness.json"
          fi
          if [ -f "$RUN_DIR/review-queue.json" ]; then
            cp "$RUN_DIR/review-queue.json" "$UPLOAD_DIR/review-queue.json"
          fi
          if [ -d "$COVERAGE_DIR" ]; then
            mkdir -p "$UPLOAD_DIR/coverage"
            cp "$COVERAGE_DIR"/* "$UPLOAD_DIR/coverage/"
          fi
          for file in preflight.json events.ndjson playwright-events.ndjson summary.json report.md run-artifacts.json network.redacted.har; do
            cp "$FEATURE_DIR/$file" "$STAGED_FEATURE_DIR/$file"
          done
          printf '%s\n' 'Binary trace, screenshot, and video artifacts are intentionally omitted from uploaded runtime smoke artifacts. completion-audit.json was produced against the runner-local run directory before those binary omissions; use upload-manifest.json for the final staged upload scope.' > "$STAGED_FEATURE_DIR/binary-artifacts-omitted.txt"
          UPLOAD_DIR="$UPLOAD_DIR" RUN_ID="$RUN_ID" FEATURE_ID="$FEATURE_ID" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.UPLOAD_DIR;
          const featureId = process.env.FEATURE_ID;
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const filePath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                return walk(filePath);
              }
              if (!entry.isFile()) {
                return [];
              }
              return path.relative(root, filePath).split(path.sep).join("/");
            });
          }
          const exactAllowed = new Set([
            "completion-audit.json",
            "redaction-audit.json",
            "review-queue.json",
            "runtime-readiness.json",
            "upload-manifest.json",
            "static/assets.json",
            "static/build.json",
            "static/context.manifest.json",
            "static/docs.index.json",
            "static/experiments.catalog.json",
            "static/experiments.xhyrom.catalog.json",
            "static/gateway.catalog.json",
            "static/gateway.userdoccers.catalog.json",
            "static/routes.catalog.json",
            "static/routes.source.catalog.json",
            "static/routes.userdoccers.catalog.json",
            "static/routes.xhyrom.catalog.json",
            "coverage/gateway.coverage.json",
            "coverage/gateway.coverage.md",
            "coverage/routes.coverage.json",
            "coverage/routes.coverage.md",
          ]);
          const featureAllowed = new Set([
            `features/${featureId}/binary-artifacts-omitted.txt`,
            `features/${featureId}/events.ndjson`,
            `features/${featureId}/network.redacted.har`,
            `features/${featureId}/playwright-events.ndjson`,
            `features/${featureId}/preflight.json`,
            `features/${featureId}/report.md`,
            `features/${featureId}/run-artifacts.json`,
            `features/${featureId}/summary.json`,
          ]);
          const manifest = {
            run_id: process.env.RUN_ID,
            feature_id: featureId,
            generated_at: new Date().toISOString(),
            gates: ["validate-redaction", "audit-run", "staged-upload-validate-redaction"],
            audit_scope: {
              redaction_audit: "runner-local run directory before upload staging",
              completion_audit: "runner-local run directory before upload staging",
              staged_upload_redaction: "final allowlisted upload directory after binary omissions",
            },
            uploaded_files: [],
            omitted_artifacts: ["static/assets/", "static/login.html", "trace.zip", "screenshots/", "video.webm", ".video/", "network.raw.har", "network.har", "storage-state.json", "fixtures.local.json"],
          };
          fs.writeFileSync(path.join(root, "upload-manifest.json"), `${JSON.stringify(manifest, null, "\t")}\n`);
          const files = walk(root).sort();
          const unexpected = files.filter((file) => !exactAllowed.has(file) && !featureAllowed.has(file));
          if (unexpected.length > 0) {
            throw new Error(`Unexpected runtime upload files: ${unexpected.join(", ")}`);
          }
          manifest.uploaded_files = files;
          fs.writeFileSync(path.join(root, "upload-manifest.json"), `${JSON.stringify(manifest, null, "\t")}\n`);
          NODE
          node packages/automatic-reverse-engineering/dist/cli.js validate-redaction \
            --input "$UPLOAD_DIR" \
            --out "$UPLOAD_DIR/redaction-audit.json"
          echo "UPLOAD_DIR=$UPLOAD_DIR" >> "$GITHUB_ENV"

      - name: Upload redacted runtime smoke run
        uses: actions/upload-artifact@v5
        with:
          name: discord-datamining-runtime-${{ env.RUN_ID }}
          path: ${{ env.UPLOAD_DIR }}
          if-no-files-found: error

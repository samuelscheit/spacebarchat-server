name: Style

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: spacebar
          POSTGRES_PASSWORD: spacebar
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_ADMIN_URL: postgres://spacebar:spacebar@127.0.0.1:5432/postgres

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run test:manifest
    - run: npm run test:guild-widget-png
    - run: npm run test:contracts
    - run: npm run test:harness
    - run: npm run test:scenarios
    - run: npm run test:protocol
    - run: npm run test:migrations
    - run: npm run bench:test
    - run: npx eslint .
    - run: npx prettier --check .
